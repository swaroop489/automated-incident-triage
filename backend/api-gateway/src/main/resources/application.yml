server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: incident-engine-api
          uri: http://${INCIDENT_ENGINE_HOST:localhost}:${INCIDENT_ENGINE_PORT:8081}
          predicates:
            - Path=/api/incidents/**, /internal/health
        - id: ai-diagnostics-api
          uri: http://${AI_DIAGNOSTICS_HOST:localhost}:${AI_DIAGNOSTICS_PORT:8082}
          predicates:
            - Path=/api/diagnostics/**

management:
  endpoints:
    web:
      exposure:
        include: health
