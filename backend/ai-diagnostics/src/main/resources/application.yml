server:
  port: 8082

spring:
  application:
    name: ai-diagnostics
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/incidentops}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-diagnostics-group
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health
